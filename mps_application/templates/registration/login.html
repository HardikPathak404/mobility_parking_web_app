{% extends "mps_application/layout.html" %}
{% block title %}
    Login
{% endblock %}
{% load static %}
<script src="{% static 'mps_application/js/login.js' %}"></script>
{% block content %}
<div class="login_container loginPage">
    <h2>Login to Your Account</h2>
    <form method="POST" action="{% url 'login' %}" id='login' novalidate onsubmit="return validateTheForm(this);">
        {% csrf_token %}
        <label for="username" id="username_label">Email Address</label>
        <input type="text" id="username" name="username" placeholder="Enter your email">
        
        <label for="password" id="password_label">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        
        <button type="submit">Login</button>
        {% if form.non_field_errors %}
        <div class="alert alert-danger" role="alert">
             {% for error in form.non_field_errors %}
                  <p>{{ error }}</p>
             {% endfor %}
           </div>
      {% endif %}
    </form>
</div>
{% endblock %}
